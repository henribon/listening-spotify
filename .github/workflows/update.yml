name: Atualiza dados do Spotify

on:
  schedule:
    # Segunda-feira, 12:00 UTC (9h em Brasilia). Semanal basta: /me/top ja
    # devolve o ranking pronto, nao ha historico pra acumular.
    - cron: '0 12 * * 1'
  workflow_dispatch:

# Um job por vez: duas execucoes em paralelo dariam conflito no push.
concurrency:
  group: spotify-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Puxa e agrega
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/update.mjs

      - name: Commita se mudou
        run: |
          git config user.name "spotify-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "sem mudanca" && exit 0
          git commit -m "chore: atualiza dados de escuta"
          git push
