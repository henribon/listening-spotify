<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ouvindo — bonbap</title>
<meta name="description" content="As músicas que mais ouvi no Spotify nas últimas semanas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://i.scdn.co" crossorigin>

<meta property="og:type" content="website">
<meta property="og:title" content="ouvindo — bonbap">
<meta property="og:description" content="As músicas que mais ouvi no Spotify nas últimas semanas.">
<meta property="og:url" content="https://bonbap.com.br/listening-spotify/">

<style>
/*
 * Mesmos tokens do bonbap.com.br. A fonte vem da raiz do domínio: como o
 * CNAME está no repo de user site, este project site é servido no mesmo
 * host, então /fonts/ resolve.
 */
@font-face {
  font-family: "Valmist";
  src: url("/fonts/TBJValmistDemo-Bold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #ffffff;
  --fg: #16161a;
  --muted: #6b6b73;
  --line: #e6e6e9;
  --hover: #f6f6f7;
  --gap: 1rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0f;
    --fg: #ededf0;
    --muted: #8a8a93;
    --line: #232327;
    --hover: #151518;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 4rem 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding: 0 1.25rem;
}

.back {
  display: inline-block;
  margin-bottom: 1.5rem;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.8125rem;
}
.back:hover, .back:focus-visible { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }

h1 {
  font-family: Valmist, ui-sans-serif, system-ui, sans-serif;
  font-weight: 700;
  font-size: clamp(2.75rem, 11vw, 3.5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0 0 0.75rem;
}

.who { margin: 0; font-size: 0.875rem; color: var(--muted); }

/* ----------------------------------------------------------- carrossel --- */

/*
 * Duas faixas com as mesmas músicas correndo em sentidos opostos.
 *
 * Desktop: uma linha em cima da outra, andando na horizontal.
 * Mobile:  duas colunas lado a lado, andando na vertical.
 *
 * Cada faixa contém duas cópias idênticas da lista. Deslizar até -50% move
 * exatamente uma cópia, e nesse instante o que está na tela é igual ao
 * quadro inicial — por isso o loop não tem emenda. A faixa invertida usa a
 * mesma animação com `animation-direction: reverse`.
 */
.carousel {
  margin-top: 3rem;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
}

.carousel[hidden] { display: none; }

.lane {
  display: flex;
  flex-direction: row;
  gap: var(--gap);
  width: max-content;
  margin: 0;
  padding: 0 1rem;
  list-style: none;
  animation: desliza-x var(--dur, 90s) linear infinite;
}

.lane--reverse { animation-direction: reverse; }

@keyframes desliza-x {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

@keyframes desliza-y {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }
}

/* Pausa pra dar tempo de mirar e clicar. */
.carousel:hover .lane,
.carousel:focus-within .lane { animation-play-state: paused; }

.item { width: clamp(8.5rem, 20vw, 11rem); flex: none; }

.item a { display: block; text-decoration: none; color: inherit; }

.item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;          /* capa de álbum é quadrada */
  object-fit: cover;
  border-radius: 0.625rem;
  background: var(--hover);
  border: 1px solid var(--line);
  transition: transform 0.18s ease;
  -webkit-user-drag: none;
}

.item a:hover img,
.item a:focus-visible img { transform: scale(1.04); }

.item .name {
  display: block;
  margin-top: 0.625rem;
  font-size: 0.8125rem;
  font-weight: 500;
  /* Nome de faixa é imprevisível: uma linha só, pra não desalinhar a altura
     dos cartões vizinhos. */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item .artist {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item a:hover .name { text-decoration: underline; text-underline-offset: 3px; }

/* ------------------------------------------------------------- mobile --- */

/*
 * Abaixo de 48rem (o mesmo ponto de quebra do bonbap.com.br) as duas faixas
 * viram colunas verticais lado a lado.
 */
@media (max-width: 47.999rem) {
  .carousel {
    flex-direction: row;
    height: clamp(26rem, 72vh, 44rem);
    /* O véu acompanha o eixo do movimento. */
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
    padding: 0 1rem;
  }

  .lane {
    flex-direction: column;
    width: auto;
    flex: 1;
    min-width: 0;
    height: max-content;
    padding: 0;
    animation-name: desliza-y;
  }

  .item { width: 100%; }

  /* Numa coluna estreita o nome ocupa mais espaço que a capa merece. */
  .item .name { margin-top: 0.5rem; font-size: 0.75rem; }
  .item .artist { font-size: 0.6875rem; }
}

/* ------------------------------------------------------------ estático --- */

/*
 * Sem animação sobra uma faixa só, rolável na mão. A segunda faixa e as
 * segundas cópias existem apenas pra emendar o loop.
 */
@media (prefers-reduced-motion: reduce) {
  .carousel {
    display: block;
    overflow-x: auto;
    height: auto;
  }
  .lane { animation: none; }
  .lane--reverse { display: none; }
  .lane [aria-hidden="true"] { display: none; }
}

:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="https://bonbap.com.br/">&larr; bonbap</a>
  <h1>ouvindo</h1>
  <p class="who" id="legenda">Carregando…</p>
</div>

<section class="carousel" aria-label="Músicas que mais ouvi no Spotify" hidden>
  <ul class="lane" id="lane-a"></ul>
  <ul class="lane lane--reverse" id="lane-b" aria-hidden="true"></ul>
</section>

<script type="module">
const SRC = 'data/listening.json';
const VELOCIDADE = 45;                                   // pixels por segundo
const MQ_VERTICAL = window.matchMedia('(max-width: 47.999rem)');

const carousel = document.querySelector('.carousel');
const laneA = document.getElementById('lane-a');
const laneB = document.getElementById('lane-b');
const legenda = document.getElementById('legenda');

function item(t, decorativo) {
  const li = document.createElement('li');
  li.className = 'item';
  // Cópias decorativas ficam fora do leitor de tela e da ordem de foco,
  // senão a mesma faixa apareceria várias vezes na navegação por teclado.
  if (decorativo) li.setAttribute('aria-hidden', 'true');

  const a = document.createElement('a');
  a.href = t.url ?? '#';
  a.target = '_blank';
  a.rel = 'noopener';
  if (decorativo) a.tabIndex = -1;

  const img = document.createElement('img');
  img.src = t.image ?? '';
  img.alt = t.image ? `Capa de ${t.album ?? t.name}` : '';
  img.decoding = 'async';
  img.draggable = false;

  const nome = document.createElement('span');
  nome.className = 'name';
  nome.textContent = t.name;

  const artista = document.createElement('span');
  artista.className = 'artist';
  artista.textContent = t.artist;

  a.append(img, nome, artista);
  li.append(a);
  return li;
}

/** Duas cópias da lista: a animação desliza -50%, que é exatamente uma. */
function preenche(lane, tracks, laneDecorativa) {
  lane.replaceChildren(
    ...tracks.map((t) => item(t, laneDecorativa)),
    ...tracks.map((t) => item(t, true)),
  );
}

/**
 * Velocidade constante em px/s, independente de quantas faixas, do tamanho
 * da tela ou do eixo. Síncrono de propósito: num requestAnimationFrame isto
 * não rodaria com a aba em segundo plano, e a fita ficaria presa no
 * fallback de 90s.
 */
function ajustaDuracao() {
  const vertical = MQ_VERTICAL.matches;
  for (const lane of [laneA, laneB]) {
    const umaCopia = (vertical ? lane.scrollHeight : lane.scrollWidth) / 2;
    if (umaCopia > 0) {
      lane.style.setProperty('--dur', `${Math.round(umaCopia / VELOCIDADE)}s`);
    }
  }
}

try {
  const r = await fetch(SRC, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const tracks = (data.tracks ?? []).filter((t) => t.image);

  if (tracks.length) {
    // Mesmas músicas nas duas faixas, mas a de baixo começa da metade da
    // lista: sem isso as duas ficam espelhadas e a repetição salta aos olhos.
    const meio = Math.floor(tracks.length / 2);
    preenche(laneA, tracks, false);
    preenche(laneB, [...tracks.slice(meio), ...tracks.slice(0, meio)], true);

    carousel.hidden = false;
    ajustaDuracao();

    // A largura dos itens — e, no mobile, a altura da coluna — muda com a
    // viewport, então a duração precisa ser recalculada.
    //
    // ResizeObserver em vez do evento `resize` da janela: ele observa a
    // caixa do próprio elemento, então pega também a troca de orientação do
    // layout, quando a faixa muda de eixo sem a janela mudar de tamanho.
    // Ajustar --dur não altera a caixa, então não há laço de realimentação.
    let pendente;
    const recalcula = () => {
      clearTimeout(pendente);
      pendente = setTimeout(ajustaDuracao, 120);
    };

    const observer = new ResizeObserver(recalcula);
    observer.observe(carousel);
    observer.observe(laneA);

    // O ResizeObserver é entregue junto com as etapas de renderização, que
    // não rodam em aba de segundo plano. O `change` do matchMedia é um
    // evento comum e chega de qualquer jeito — é ele que garante a troca de
    // eixo se a pessoa girar o aparelho com a aba escondida.
    MQ_VERTICAL.addEventListener('change', recalcula);

    legenda.textContent =
      `as ${tracks.length} músicas que mais ouvi ${data.range_label ?? 'nas últimas semanas'}`;
  } else {
    legenda.textContent = 'ainda sem dados — a coleta roda toda segunda-feira';
  }
} catch (e) {
  legenda.textContent = 'não consegui carregar o que ando ouvindo agora';
  console.warn('carrossel:', e);
}
</script>
</body>
</html>
