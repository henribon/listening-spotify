<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ouvindo — bonbap</title>
<meta name="description" content="As músicas que mais ouvi no Spotify nas últimas semanas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://i.scdn.co" crossorigin>

<meta property="og:type" content="website">
<meta property="og:title" content="ouvindo — bonbap">
<meta property="og:description" content="As músicas que mais ouvi no Spotify nas últimas semanas.">
<meta property="og:url" content="https://bonbap.com.br/listening-spotify/">

<style>
/*
 * Mesmos tokens do bonbap.com.br. A fonte vem da raiz do domínio: como o
 * CNAME está no repo de user site, este project site é servido no mesmo
 * host, então /fonts/ resolve. Fora dele, o fallback entra pelo swap.
 */
@font-face {
  font-family: "Valmist";
  src: url("/fonts/TBJValmistDemo-Bold.ttf") format("truetype");
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #ffffff;
  --fg: #16161a;
  --muted: #6b6b73;
  --line: #e6e6e9;
  --hover: #f6f6f7;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0f;
    --fg: #ededf0;
    --muted: #8a8a93;
    --line: #232327;
    --hover: #151518;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 4rem 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* O texto fica na coluna estreita; o carrossel corre a largura toda. */
.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding: 0 1.25rem;
}

.back {
  display: inline-block;
  margin-bottom: 1.5rem;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.8125rem;
}
.back:hover, .back:focus-visible { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; }

h1 {
  font-family: Valmist, ui-sans-serif, system-ui, sans-serif;
  font-weight: 700;
  font-size: clamp(2.75rem, 11vw, 3.5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  margin: 0 0 0.75rem;
}

.who { margin: 0; font-size: 0.875rem; color: var(--muted); }

/* ----------------------------------------------------------- carrossel --- */

.carousel {
  margin-top: 3rem;
  overflow: hidden;
  /* Some nas pontas em vez de cortar seco na borda da tela. */
  -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
}

.carousel[hidden] { display: none; }

/*
 * A fita tem duas cópias idênticas da lista lado a lado. Deslizar até -50%
 * move exatamente uma cópia, e nesse instante o que está na tela é igual ao
 * quadro inicial — daí o loop não tem emenda visível.
 */
.track {
  display: flex;
  gap: 1rem;
  width: max-content;
  margin: 0;
  padding: 0 1rem;
  list-style: none;
  animation: slide var(--dur, 90s) linear infinite;
}

@keyframes slide {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Pausa pra dar tempo de mirar e clicar. */
.carousel:hover .track,
.carousel:focus-within .track { animation-play-state: paused; }

.item { width: clamp(8.5rem, 20vw, 11rem); flex: none; }

.item a {
  display: block;
  text-decoration: none;
  color: inherit;
}

.item img {
  display: block;
  width: 100%;
  aspect-ratio: 1;          /* capa de álbum é quadrada */
  object-fit: cover;
  border-radius: 0.625rem;
  background: var(--hover);
  border: 1px solid var(--line);
  transition: transform 0.18s ease;
  -webkit-user-drag: none;
}

.item a:hover img,
.item a:focus-visible img { transform: scale(1.04); }

.item .name {
  display: block;
  margin-top: 0.625rem;
  font-size: 0.8125rem;
  font-weight: 500;
  /* Nome de faixa é imprevisível: corta em uma linha só pra não desalinhar
     a altura dos cartões vizinhos. */
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item .artist {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item a:hover .name { text-decoration: underline; text-underline-offset: 3px; }

/*
 * Sem animação, a fita vira uma faixa rolável na mão. A segunda cópia sai
 * de cena: ela só existe pra emendar o loop.
 */
@media (prefers-reduced-motion: reduce) {
  .carousel { overflow-x: auto; }
  .track { animation: none; }
  .track [aria-hidden="true"] { display: none; }
}

:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="https://bonbap.com.br/">&larr; bonbap</a>
  <h1>ouvindo</h1>
  <p class="who" id="legenda">Carregando…</p>
</div>

<section class="carousel" aria-label="Músicas que mais ouvi no Spotify" hidden>
  <ul class="track" id="track"></ul>
</section>

<script type="module">
const SRC = 'data/listening.json';
const VELOCIDADE = 45; // pixels por segundo

const carousel = document.querySelector('.carousel');
const track = document.getElementById('track');
const legenda = document.getElementById('legenda');

function item(t, clone) {
  const li = document.createElement('li');
  li.className = 'item';
  // A segunda cópia é decorativa: escondê-la do leitor de tela e do foco
  // evita que a mesma faixa apareça duas vezes na navegação por teclado.
  if (clone) {
    li.setAttribute('aria-hidden', 'true');
  }

  const a = document.createElement('a');
  a.href = t.url ?? '#';
  a.target = '_blank';
  a.rel = 'noopener';
  if (clone) a.tabIndex = -1;

  const img = document.createElement('img');
  img.src = t.image ?? '';
  img.alt = t.image ? `Capa de ${t.album ?? t.name}` : '';
  img.decoding = 'async';
  img.draggable = false;

  const nome = document.createElement('span');
  nome.className = 'name';
  nome.textContent = t.name;

  const artista = document.createElement('span');
  artista.className = 'artist';
  artista.textContent = t.artist;

  a.append(img, nome, artista);
  li.append(a);
  return li;
}

function build(tracks) {
  // Duas cópias: a animação desliza -50%, que é exatamente uma delas.
  const items = [
    ...tracks.map((t) => item(t, false)),
    ...tracks.map((t) => item(t, true)),
  ];
  track.replaceChildren(...items);
  carousel.hidden = false;

  // Duração proporcional à largura, pra velocidade não mudar conforme o
  // número de faixas ou o tamanho da tela.
  //
  // Síncrono de propósito: ler scrollWidth já força o layout, e a largura
  // dos itens vem do CSS, não das imagens. Num requestAnimationFrame isto
  // não rodaria enquanto a aba estivesse em segundo plano, e o carrossel
  // ficaria preso na duração de fallback.
  const umaCopia = track.scrollWidth / 2;
  if (umaCopia > 0) {
    track.style.setProperty('--dur', `${Math.round(umaCopia / VELOCIDADE)}s`);
  }
}

try {
  const r = await fetch(SRC, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const tracks = (data.tracks ?? []).filter((t) => t.image);

  if (tracks.length) {
    build(tracks);
    legenda.textContent =
      `as ${tracks.length} músicas que mais ouvi ${data.range_label ?? 'nas últimas semanas'}`;
  } else {
    legenda.textContent = 'ainda sem dados — a coleta roda toda segunda-feira';
  }
} catch (e) {
  legenda.textContent = 'não consegui carregar o que ando ouvindo agora';
  console.warn('carrossel:', e);
}
</script>
</body>
</html>
